name: Sprites aktualisieren

on:
  schedule:
    - cron: '17 5 * * *'   # täglich 05:17 UTC
  workflow_dispatch:        # manuell über "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-sprites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Neue Minecraft-Releases einlesen
        run: npm run update
      - name: Änderungen committen
        id: commit
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Keine neue Version."; exit 0
          fi
          git config user.name "sprite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Sprites: $(node -p "require('./public/data/versions.json').versions[0].id")"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Nur nötig, wenn Cloudflare Pages NICHT mit diesem Repo verbunden ist (sonst deployt der Push von selbst)
      - name: Auf Cloudflare Pages deployen
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy public --project-name mc-sprite-atlas --branch main
